<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Ubah nama di bawah ini sesuai keinginan -->
  <title>Portofolio - Adrian</title>
  
  <style>
    /* Mengambil font dari Google Fonts */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #0a0a0a;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      
      /* Latar belakang gradien seperti neon */
      background: radial-gradient(circle at 70% 50%, rgba(139, 42, 42, 0.4) 0%, rgba(0, 51, 102, 0.6) 40%, #0a0a0a 80%);
    }

    /* === HEADER LAYOUT === */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 40px;
      font-size: 14px;
      font-weight: 400;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      color: #a0a0a0;
    }
    
    .status-badge span {
      height: 6px;
      width: 6px;
      background-color: #4ade80;
      border-radius: 50%;
      margin-right: 8px;
    }

    nav {
      color: #a0a0a0;
    }
    nav a {
      color: #ffffff;
      text-decoration: none;
      margin: 0 6px; /* Memberi jarak antar menu */
    }
    nav a:hover {
      text-decoration: underline;
    }

    .cta-button {
      color: #ffffff;
      text-decoration: none;
      border-bottom: 1px solid #ffffff;
      padding-bottom: 2px;
      transition: opacity 0.3s;
    }
    .cta-button:hover {
      opacity: 0.7;
    }

    /* === MAIN CONTENT (HERO) === */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 40px;
      max-width: 750px;
    }

    h1 {
      font-size: 4.5rem;
      line-height: 1.05;
      margin: 0 0 25px 0;
      font-weight: 500;
      letter-spacing: -1.5px;
    }

    .sub-headline {
      font-size: 1.1rem;
      color: #d1d1d1;
      line-height: 1.5;
      max-width: 420px;
      margin-bottom: 30px;
      font-weight: 300;
    }

    .view-projects {
      color: #ffffff;
      text-decoration: none;
      border-bottom: 1px solid #ffffff;
      width: max-content;
      padding-bottom: 2px;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.3s;
    }
    .view-projects:hover {
      opacity: 0.7;
    }

    /* === FOOTER (STATISTIK) === */
    footer {
      padding: 25px 40px;
      display: flex;
      gap: 40px;
      color: #a0a0a0;
      font-size: 13px;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .stat-item::after {
      content: "";
      display: block;
      width: 100px;
      height: 1px;
      background-color: #333;
    }

    /* Responsif untuk HP */
    @media (max-width: 768px) {
      body {
        height: auto;
        overflow: visible; /* Memungkinkan scroll di HP */
      }
      header { flex-direction: column; align-items: flex-start; gap: 15px; padding: 20px; }
      nav { display: none; }
      h1 { font-size: 3rem; }
      main { padding: 40px 20px; }
      footer { padding: 20px; flex-direction: column; gap: 20px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <!-- Icon Segitiga -->
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 22h20L12 2z"/></svg> 
      ADRIAN.
    </div>
    
    <div class="status-badge">
      <span></span> Available for freelance
    </div>
    
    <nav>
      <!-- Ganti tanda # dengan tautan halaman Anda nanti -->
      <a href="#home">Home</a>, 
      <a href="#projects">Projects</a>, 
      <a href="#services">Services</a>, 
      <a href="#blog">Blog</a>, 
      <a href="#contact">Contact</a>
    </nav>
    
    <!-- Tombol Hire Me: Ganti tautan dengan email atau WhatsApp -->
    <a href="mailto:emailanda@gmail.com" class="cta-button">Hire Me &rarr;</a>
  </header>

  <main>
    <h1>Manajemen strategis & solusi digital untuk bisnis modern.</h1>
    
    <div class="sub-headline">
      Manajemen Bisnis Digital, Analisis Data Terukur, & Desain Visual untuk pengembangan tim yang ambisius.
    </div>
    
    <!-- Tombol View Projects -->
    <a href="#projects" class="view-projects">View Projects &rarr;</a>
  </main>

  <footer>
    <div class="stat-item">Data & Research</div>
    <div class="stat-item">Visual Design</div>
  </footer>

</body>
</html>
